# LiteLLM widget config - copy to config.ini and fill in your own values
# config.ini contains your api key: it is gitignored and must NEVER be committed
base_url=http://your-litellm-proxy:8080/v1
api_key=sk-v3___REPLACE_WITH_YOUR_KEY___
refresh_seconds=60
warn_pct=80
crit_pct=95
probe_model=Qwen3.8-Flash
opacity=0.85

# Relay mode: probe through an ssh tunnel so egress happens from the relay host's IP.
# Use when the proxy's LB pins your desktop's IP to an instance with a stale spend ledger.
# relay_target defaults to the host:port parsed from base_url (resolved on the relay side).
relay_enabled=0
relay_ssh_host=your-relay-host
relay_ssh_port=22
relay_ssh_user=youruser
relay_local_port=18080
# relay_target=litellm-proxy-host:8080
